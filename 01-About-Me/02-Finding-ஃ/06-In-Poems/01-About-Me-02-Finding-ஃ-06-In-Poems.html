    :root {
      color-scheme: light;
      --bg: var(--theme-background);
      --panel: var(--theme-panel);
      --text: var(--theme-text);
      --muted: var(--theme-muted);
      --accent: var(--theme-accent);
      --link: var(--theme-link);
      --line: var(--theme-line);
      --serif: "Mukta Malar", Georgia, "Noto Serif Tamil", "Nirmala UI", "Latha", "Tamil Sangam MN", serif;
      --sans: "Mukta Malar", system-ui, -apple-system, "Segoe UI", "Noto Sans Tamil", "Nirmala UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 22px 56px;
      font-family: var(--sans);
      line-height: 1.8;
      color: var(--text);
      background: var(--bg);
    }

    a { color: var(--link); text-underline-offset: 3px; }
    a:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ---------- Welcome ---------- */
    .hero { text-align: center; }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1rem, 5.2vw, 2.6rem);
      line-height: 1.5;
      color: var(--accent);
      white-space: nowrap;
    }

    .ornament {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 160px;
      margin: 22px auto 24px;
      color: var(--line);
    }
    .ornament::before,
    .ornament::after {
      content: "";
      flex: 1;
      border-top: 1px solid currentColor;
    }
    .ornament span {
      width: 7px;
      height: 7px;
      background: var(--accent);
      transform: rotate(45deg);
    }

    .tagline {
      margin: 0 auto 28px;
      max-width: 30rem;
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.05rem, 3.2vw, 1.25rem);
      color: var(--muted);
      text-wrap: balance;
    }

    .hello {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.35rem;
      color: var(--text);
    }
    .hello strong { color: var(--accent); font-weight: 600; }

    .intro {
      margin: 6px auto 0;
      max-width: 30rem;
      color: var(--muted);
      text-wrap: balance;
    }

    .contact {
      margin: 22px 0 0;
      font-size: 0.95rem;
      color: var(--muted);
    }

    /* ---------- Library ---------- */
    .library { margin-top: clamp(44px, 9vw, 72px); }

    h2 {
      margin: 0 0 6px;
      font-family: var(--serif);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent);
    }

    .library ul { list-style: none; margin: 0; padding: 0; }
    .library li { border-bottom: 1px solid var(--line); }
    .library li:first-child { border-top: 1px solid var(--line); }

    .library a {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 4px;
      text-decoration: none;
      color: var(--text);
    }
    .library a:hover { color: var(--accent); }
    .library a:hover .arrow { transform: translateX(4px); }

    .work-name { font-family: var(--serif); font-size: 1.2rem; }
    .work-sub { display: block; font-size: 0.85rem; color: var(--muted); }
    .arrow { flex: none; color: var(--muted); transition: transform 0.15s ease; }

    /* ---------- Thanks ---------- */
    .thanks {
      margin-top: clamp(44px, 9vw, 72px);
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .thanks p { margin: 8px 0 0; }

    .thanks details { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .thanks summary {
      cursor: pointer;
      font-size: 0.92rem;
      color: var(--link);
    }
    .thanks details[open] summary { margin-bottom: 8px; }
    .thanks details p,
    .thanks details h3 {
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--muted);
    }
    .thanks details h3 { margin: 0; font-size: 0.95rem; font-weight: 600; }
    .thanks details hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

    @media (prefers-reduced-motion: reduce) {
      .arrow { transition: none; }
    }
