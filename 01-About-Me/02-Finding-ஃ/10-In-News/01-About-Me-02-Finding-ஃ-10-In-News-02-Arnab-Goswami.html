    :root {
      color-scheme: light;
      --bg: var(--theme-background);
      --panel: var(--theme-panel);
      --text: var(--theme-text);
      --muted: var(--theme-muted);
      --accent: var(--theme-accent);

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--sans);
      line-height: 1.8;
      color: var(--text);
      background: var(--bg);
    }
    a { color: var(--link); text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    /* top bar */
    .topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: .5rem;
      padding: .55rem 1rem;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-title { font-size: .88rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .spacer { flex: 1; }
    .icon-btn {
      flex: none; min-width: 2.4rem; height: 2.4rem;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--line); border-radius: 9px; padding: 0 .6rem;
      background: var(--panel); color: var(--text);
      font: inherit; font-size: .9rem; text-decoration: none; cursor: pointer;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn svg { width: 1.15rem; height: 1.15rem; display: block; }

    /* page */
    /* Homepage top spacing is intentionally not shared with reading pages. */
    main { max-width: 720px; margin: 0 auto; padding: 0 22px 72px; }

    h1 {
      margin: 0;

      font-weight: 600;
      font-size: clamp(1.7rem, 6vw, 2.6rem);
      line-height: 1.5;
      color: var(--accent);
      text-wrap: balance;
    }
    h2 {
      margin: clamp(40px, 8vw, 64px) 0 0;
      padding-top: 24px;

      margin: 18px 0 24px;
      font-family: var(--serif);
      font-size: var(--read-size);
      line-height: 2.05;
      overflow-wrap: anywhere;

    .callout {
      margin: 24px 0 0;

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    /* ---- general markdown content ---- */

    blockquote { margin: 22px 0; padding: 2px 0 2px 16px; border-left: 3px solid var(--line); color: var(--muted); }
    blockquote > :last-child { margin-bottom: 0; }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: var(--panel); padding: .1em .35em; border-radius: 5px; }
    pre { margin: 0 0 1.2rem; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; line-height: 1.6; }

    table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 0 0 1.2rem; }
