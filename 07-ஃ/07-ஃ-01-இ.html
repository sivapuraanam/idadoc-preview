    :root {
      color-scheme: light;
      --bg: var(--theme-background);
      --panel: var(--theme-panel);
      --text: var(--theme-text);
      --muted: var(--theme-muted);
      --accent: var(--theme-accent);

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--sans);
      line-height: 1.8;
      color: var(--text);
      background: var(--bg);
    }
    a { color: var(--link); text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    /* top bar */
    .topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: .5rem;
      padding: .55rem 1rem;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-title { font-size: .88rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .spacer { flex: 1; }
    .icon-btn {
      flex: none; min-width: 2.4rem; height: 2.4rem;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--line); border-radius: 9px; padding: 0 .6rem;
      background: var(--panel); color: var(--text);
      font: inherit; font-size: .9rem; text-decoration: none; cursor: pointer;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn svg { width: 1.15rem; height: 1.15rem; display: block; }

    /* page */
    /* Homepage top spacing is intentionally not shared with reading pages. */
    main { max-width: 720px; margin: 0 auto; padding: 0 22px 72px; }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.7rem, 6vw, 2.6rem);
      line-height: 1.5;
      color: var(--accent);
      text-wrap: balance;
    }
    h2 {
      margin: clamp(40px, 8vw, 64px) 0 0;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.35rem, 4.5vw, 1.75rem);
      line-height: 1.5;
      color: var(--accent);
    }

    .verse {
      margin: 18px 0 24px;
      font-family: var(--serif);
      font-size: var(--read-size);
      line-height: 2.05;
      overflow-wrap: anywhere;
    }

    /* callouts */
    .callout {
      margin: 24px 0 0;
      padding: 14px 18px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
    }

      margin: 0 0 4px;

      font-size: 1rem;

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    /* ---- general markdown content ---- */
    .para { margin: 0 0 1.1rem; overflow-wrap: anywhere; }

    h3 { font-size: 1.2rem; } h4 { font-size: 1.1rem; } h5, h6 { font-size: 1rem; }

    ul, ol { margin: 0 0 1.1rem; padding-left: 1.5rem; }
    li { margin: .3rem 0; } li > ul, li > ol { margin: .3rem 0 0; }
    blockquote { margin: 22px 0; padding: 2px 0 2px 16px; border-left: 3px solid var(--line); color: var(--muted); }
    blockquote > :last-child { margin-bottom: 0; }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: var(--panel); padding: .1em .35em; border-radius: 5px; }
    pre { margin: 0 0 1.2rem; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; line-height: 1.6; }
    pre code { background: none; padding: 0; }
    table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 0 0 1.2rem; }
    th, td { border: 1px solid var(--line); padding: .45rem .8rem; text-align: left; }
    th { background: var(--panel); font-weight: 600; }
    img { max-width: 100%; height: auto; border-radius: 8px; }
    mark { background: var(--accent-soft); color: inherit; padding: 0 .15em; border-radius: 3px; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
